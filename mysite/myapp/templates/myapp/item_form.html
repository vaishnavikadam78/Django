{% extends 'myapp/base.html' %}

{% block body %}

<div class="flex flex-col justify-center items-center min-h-screen p-10">

    <h2 class="text-2xl font-bold mb-6">Add Item</h2>
    {{ form.errors}}

    <form method="POST">

        {% csrf_token %}

        {% for field in form %}
            <div class="mb-4">
                <label class="block mb-1">
                    {{ field.label }}
                </label>

                <div class="border rounded p-2">
                    {{ field }}
                </div>

                {% if field.errors %}
                    <div class="text-red-500 text-sm">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit"
                class="bg-blue-600 text-white px-6 py-2 rounded">
            Add Item
        </button>

    </form>

</div>

{% endblock %}
